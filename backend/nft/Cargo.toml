[package]
name = "nft"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ledger_authority = {path = "../ledger_authority"}

serde_json = "1.0.9"
crypto = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
heimdall = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
ark-circom-service = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
witness-utils= {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
serde = { version = "1.0", features = ["derive"] }
num-bigint = { version = "0.4",default-features = false, features = ["serde", "rand"]}
num-traits = {version = "0.2.15",  default-features = false}
rand = "0.8"


[features]
rapid_witnesscalc = ["heimdall/rapid_witnesscalc", "ark-circom-service/rapid_witnesscalc", "ledger_authority/rapid_witnesscalc"]