[package]
name = "la_api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rocket = { version = "0.5.0-rc.3", features = ["secrets", "tls", "json"] }
num-bigint = { version = "0.4",default-features = false, features = ["serde", "rand"]}
futures = { version = "0.3.28" }
db_service = {path = "../db_service"}
ledger_authority = {path = "../ledger_authority"}
crypto = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.9"
ark-circom-service = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}

[features]
rapid_witnesscalc = ["ledger_authority/rapid_witnesscalc", "ark-circom-service/rapid_witnesscalc"]